name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download OCR language data (Bangla + English, tessdata_best)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L -o app/src/main/assets/tessdata/ben.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/ben.traineddata
          curl -L -o app/src/main/assets/tessdata/eng.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata

      - name: Download layout model (PP-DocLayout-S, ONNX export)
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -o app/src/main/assets/models/pp_doclayout_s.onnx \
            https://huggingface.co/stefanj0/PP-DocLayout-S-ONNX/resolve/main/pp_doclayout_s.onnx
          echo "33688dbee1c23e34b81777e97cb428eb40f24b242c02b5f623484959e830aec8  app/src/main/assets/models/pp_doclayout_s.onnx" | sha256sum -c -

      - name: Download table structure model (SLANet_plus, ONNX) and its real vocabulary file
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -o app/src/main/assets/models/slanet_plus.onnx \
            https://huggingface.co/RapidAI/RapidTable/resolve/main/slanet-plus.onnx
          curl -L -o app/src/main/assets/models/table_structure_dict_ch.txt \
            https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/dict/table_structure_dict_ch.txt
          size=$(stat -c%s app/src/main/assets/models/table_structure_dict_ch.txt)
          echo "table_structure_dict_ch.txt: $size bytes"
          if [ "$size" -lt 50 ]; then
            echo "ERROR: vocabulary file looks wrong (too small) — source path may have moved"
            cat app/src/main/assets/models/table_structure_dict_ch.txt
            exit 1
          fi

      - name: Download English OCR models (PP-OCRv5 mobile detection + recognition, ONNX) and real dictionary
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -o app/src/main/assets/models/ppocr_en_det.ort \
            https://huggingface.co/pdfmarkdownapp/ppu-paddle-ocr-models/resolve/main/detection/PP-OCRv5_mobile_det_infer.ort
          curl -L -o app/src/main/assets/models/ppocr_en_rec.onnx \
            https://huggingface.co/pdfmarkdownapp/ppu-paddle-ocr-models/resolve/main/recognition/PP-OCRv5_mobile_rec_infer.onnx
          curl -L -o app/src/main/assets/models/ppocr_en_dict.txt \
            https://huggingface.co/pdfmarkdownapp/ppu-paddle-ocr-models/resolve/main/recognition/ppocrv5_dict.txt
          for f in ppocr_en_det.ort ppocr_en_rec.onnx ppocr_en_dict.txt; do
            size=$(stat -c%s app/src/main/assets/models/$f)
            echo "$f: $size bytes"
            if [ "$size" -lt 1000 ]; then
              echo "ERROR: $f looks wrong (too small) — source path may have moved"
              cat app/src/main/assets/models/$f
              exit 1
            fi
          done


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
